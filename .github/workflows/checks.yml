name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m lc_simplenet doctor
      - run: uv run --frozen python scripts/check_repository.py
      - run: git diff --check
  scientific-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv run --frozen --extra cpu pytest
      - run: uv run --frozen --extra cpu python scripts/smoke_upstream.py
      - run: uv run --frozen --extra cpu python scripts/smoke_paired.py
