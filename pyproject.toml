[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai6103-lc-simplenet"
version = "0.1.0"
description = "AI6103 paired relighting and score consistency research scaffold"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
cpu = [
  "torch==2.6.0", "torchvision==0.21.0", "timm==1.0.15",
  "scipy==1.15.3", "scikit-learn==1.6.1", "scikit-image==0.25.2",
  "pandas==2.2.3", "opencv-python==4.11.0.86", "matplotlib==3.10.3",
  "tensorboard==2.19.0", "click==8.2.1", "tqdm==4.67.1", "pillow==11.3.0",
]
cuda = [
  "torch==2.6.0", "torchvision==0.21.0", "timm==1.0.15",
  "scipy==1.15.3", "scikit-learn==1.6.1", "scikit-image==0.25.2",
  "pandas==2.2.3", "opencv-python==4.11.0.86", "matplotlib==3.10.3",
  "tensorboard==2.19.0", "click==8.2.1", "tqdm==4.67.1", "pillow==11.3.0",
]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.2"]

[tool.uv]
required-version = "==0.13.0"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu124", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu124", extra = "cuda" }]

[tool.hatch.build.targets.wheel]
packages = ["src/lc_simplenet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
